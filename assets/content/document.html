<!doctype html>
<html lang="zh-CN" data-theme="light" data-default-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>@@FONT@@
@@CSS@@</style>
@@FONTLICENSE@@
@@MATH@@
</head>
<body class="scene-@@SCENE@@" data-document-id="@@DOCUMENTID@@">
<a class="skip-link" href="#content">跳到正文</a>
<header id="reading-toolbar" class="toolbar" data-export-ui>
  <a class="wordmark" href="#content">@@LABEL@@<span class="wordmark-dot"></span></a>
  <div class="reader-controls">
    <button id="font-picker-toggle" aria-haspopup="dialog" aria-controls="font-picker" aria-expanded="false" title="选择正文字体"><span id="font-family-label">默认字体</span><span aria-hidden="true">⌄</span></button>
    <div class="font-control" role="group" aria-label="正文字号"><button id="font-smaller" aria-label="减小字号" title="减小字号">A−</button><output id="font-size" aria-live="polite">18px</output><button id="font-larger" aria-label="增大字号" title="增大字号">A+</button></div>
    <div class="width-control" role="group" aria-label="正文宽度">
      <label for="reading-width">宽度</label><input id="reading-width" type="range" min="40" max="80" step="1" value="60" title="正文占页面宽度的比例"><output id="reading-width-value" for="reading-width">60%</output>
      <button id="reset-reading-width" class="icon-button" aria-label="恢复默认宽度" title="恢复默认宽度"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.8 8.5M3 4v6h6"/></svg></button>
    </div>
    <div class="tools">
      <button id="print-article" class="icon-button" aria-label="打印或保存 PDF" title="打印或保存 PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6zM18 12h.01"/></svg></button>
      <select id="palette-select" aria-label="页面配色"><optgroup label="浅色"><option value="white">纯白</option><option value="paper">纸白</option><option value="warm">暖米</option></optgroup><optgroup label="深色"><option value="graphite">石墨</option><option value="midnight">午夜蓝</option><option value="ink">暖墨</option></optgroup></select>
      <button id="theme-toggle" class="icon-button" aria-label="切换到深色主题" title="切换主题"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a8.5 8.5 0 1 0 10.3 10.3Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </div>
  <button id="toolbar-collapse" class="icon-button toolbar-fold" aria-controls="reading-toolbar" aria-expanded="true" aria-label="收起工具栏" title="收起工具栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
</header>
<div id="font-picker" class="font-picker" role="dialog" aria-label="选择正文字体" data-export-ui hidden>
  <label for="font-search">字体</label>
  <input id="font-search" type="search" placeholder="搜索字体名称" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="font-options">
  <div id="font-options" role="listbox" aria-label="字体候选"></div>
  <p id="font-picker-status" role="status"></p>
  <button id="load-local-fonts">加载本机字体</button>
</div>
<button id="toolbar-reveal" class="icon-button toolbar-reveal" aria-controls="reading-toolbar" aria-expanded="false" aria-label="展开工具栏" title="展开工具栏" data-export-ui hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<div class="reading-progress" data-export-ui><span id="reading-progress"></span></div>
<button id="toc-toggle" class="icon-button side-toc-toggle" aria-controls="toc" aria-expanded="true" aria-label="切换章节目录" title="章节目录" data-export-ui><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg></button>
<div class="document-layout">
  <aside id="toc" class="toc" aria-label="章节目录" data-export-ui><div class="toc-heading"><p class="toc-label">本文目录</p><span id="toc-count" class="toc-count"></span></div><nav id="toc-links"></nav></aside>
  <main id="content">
    <header class="article-header"><h1>@@TITLE@@</h1>@@DESCRIPTION@@<p class="article-meta">@@META@@</p></header>
    <div id="resume-banner" class="resume-banner" hidden><div><span>上次读到</span><strong id="resume-title"></strong></div><button id="resume-reading">继续阅读</button><button id="dismiss-reading" aria-label="忽略上次阅读位置">忽略</button></div>
    <p id="reading-status" class="sr-only" role="status"></p>
    <article class="prose">@@BODY@@</article>
    <footer class="article-footer"><a href="#content">回到开头 ↑</a><span>@@TITLE@@</span></footer>
  </main>
</div>
<script>@@JS@@</script>
</body>
</html>
