<!doctype html>
<html lang="zh-CN" data-theme="light" data-default-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>@@FONT@@
@@CSS@@</style>
@@FONTLICENSE@@
@@MATH@@
</head>
<body class="scene-@@SCENE@@" data-document-id="@@DOCUMENTID@@">
<a class="skip-link" href="#content">跳到正文</a>
<header class="toolbar" data-export-ui>
  <div class="font-control" role="group" aria-label="正文字号"><button id="font-smaller" aria-label="减小字号">A−</button><output id="font-size" aria-live="polite">18px</output><button id="font-larger" aria-label="增大字号">A+</button></div>
  <a class="wordmark" href="#content">@@LABEL@@<span class="wordmark-dot"></span></a>
  <div class="tools"><button id="reader-settings" aria-haspopup="dialog">阅读</button><button id="toc-toggle" aria-controls="toc" aria-expanded="true">目录</button><select id="palette-select" aria-label="页面配色"><optgroup label="浅色"><option value="white">纯白</option><option value="paper">纸白</option><option value="warm">暖米</option></optgroup><optgroup label="深色"><option value="graphite">石墨</option><option value="midnight">午夜蓝</option><option value="ink">暖墨</option></optgroup></select><button id="theme-toggle" class="icon-button" aria-label="切换到深色主题" title="切换主题"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a8.5 8.5 0 1 0 10.3 10.3Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>
<div class="reading-progress" data-export-ui><span id="reading-progress"></span></div>
<div class="document-layout">
  <aside id="toc" class="toc" aria-label="章节目录" data-export-ui><div class="toc-heading"><p class="toc-label">本文目录</p><span id="toc-count" class="toc-count"></span></div><nav id="toc-links"></nav></aside>
  <main id="content">
    <header class="article-header"><h1>@@TITLE@@</h1>@@DESCRIPTION@@<p class="article-meta">@@META@@</p></header>
    <div id="resume-banner" class="resume-banner" hidden><div><span>上次读到</span><strong id="resume-title"></strong></div><button id="resume-reading">继续阅读</button><button id="dismiss-reading" aria-label="忽略上次阅读位置">忽略</button></div>
    <p id="reading-status" class="sr-only" role="status"></p>
    <article class="prose">@@BODY@@</article>
    <footer class="article-footer"><a href="#content">回到开头 ↑</a><span>@@TITLE@@</span></footer>
  </main>
</div>
<script>@@JS@@</script>
</body>
</html>
