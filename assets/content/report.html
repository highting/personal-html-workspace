<!doctype html>
<html lang="zh-CN" data-theme="light" data-default-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>@@FONT@@
@@CSS@@</style>
@@FONTLICENSE@@
@@MATH@@
</head>
<body class="scene-report">
<header class="toolbar" data-export-ui><span class="wordmark">技术汇报<span class="wordmark-dot"></span></span><div class="tools"><button id="toc-toggle" aria-controls="toc" aria-expanded="false">目录</button><button id="notes-toggle" aria-controls="speaker-notes" aria-expanded="false">备注</button><select id="palette-select" aria-label="页面配色"><optgroup label="浅色"><option value="white">纯白</option><option value="paper">纸白</option><option value="warm">暖米</option></optgroup><optgroup label="深色"><option value="graphite">石墨</option><option value="midnight">午夜蓝</option><option value="ink">暖墨</option></optgroup></select><button id="theme-toggle" class="icon-button" aria-label="切换到深色主题" title="切换主题"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a8.5 8.5 0 1 0 10.3 10.3Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<aside id="toc" class="toc report-toc" data-export-ui><p class="toc-label">汇报目录</p><nav id="toc-links"></nav></aside>
<main class="presentation" id="content"><div class="slide-stage">@@BODY@@</div></main>
<footer class="slide-controls" data-export-ui><button id="previous-slide" aria-label="上一页">←</button><span id="slide-counter" aria-live="polite"></span><button id="next-slide" aria-label="下一页">→</button><span class="keyboard-hint">← → 翻页 · N 备注</span></footer>
<aside id="speaker-notes" class="speaker-notes" hidden data-export-ui><p class="toc-label">讲者备注</p><div id="notes-content"></div></aside>
<script>@@JS@@</script>
</body>
</html>
