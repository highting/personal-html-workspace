<!doctype html>
<html lang="zh-CN" data-theme="light" data-default-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>@@FONT@@
@@CSS@@</style>
@@FONTLICENSE@@
@@MATH@@
</head>
<body class="scene-report">
<header class="toolbar" aria-label="汇报工具" data-export-ui><div class="tools"><button id="toc-toggle" aria-label="目录" title="目录（M）" aria-controls="toc" aria-expanded="false"><span class="report-icon" aria-hidden="true">&#xf0c9;</span></button><button id="notes-toggle" aria-controls="speaker-notes" aria-expanded="false" title="讲者备注（N）">备注</button><select id="palette-select" aria-label="页面配色"><optgroup label="浅色"><option value="white">纯白</option><option value="paper">纸白</option><option value="warm">暖米</option></optgroup><optgroup label="深色"><option value="graphite">石墨</option><option value="midnight">午夜蓝</option><option value="ink">暖墨</option></optgroup></select><button id="theme-toggle" class="icon-button" aria-label="切换到深色主题" title="切换主题"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a8.5 8.5 0 1 0 10.3 10.3Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<button id="toc-backdrop" class="toc-backdrop" aria-label="关闭目录遮罩" hidden tabindex="-1" data-export-ui></button>
<aside id="toc" class="toc report-toc" aria-label="汇报目录" data-export-ui><div class="toc-heading"><p class="toc-label">汇报目录</p><button id="toc-close" aria-label="关闭目录"><span class="report-icon" aria-hidden="true">&#xf00d;</span></button></div><nav id="toc-links"></nav></aside>
<main class="presentation" id="content"><div class="slide-stage">@@BODY@@</div></main>
<footer class="slide-controls" data-export-ui><button id="previous-slide" aria-label="上一页" title="上一页（←）"><span class="report-icon" aria-hidden="true">&#xf104;</span></button><span id="slide-counter" aria-live="polite"></span><button id="next-slide" aria-label="下一页" title="下一页（→）"><span class="report-icon" aria-hidden="true">&#xf105;</span></button></footer>
<div class="report-progress" aria-hidden="true" data-export-ui><span></span></div>
<aside id="speaker-notes" class="speaker-notes" hidden data-export-ui><p class="toc-label">讲者备注</p><div id="notes-content"></div></aside>
<script>@@JS@@</script>
</body>
</html>
